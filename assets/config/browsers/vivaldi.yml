name: Vivaldi
flatpak: com.vivaldi.Vivaldi
system_bin: 
  - vivaldi
  - vivaldi-stable
can_isolate: true
can_start_maximized: true
desktop_file_name_prefix: com.vivaldi.Vivaldi.vivaldi
base: chromium
issues:
  en:
    - Does not remember window size and position unless the app is isolated
  nl:
    - Onthoudt de grootte en positie van het venster niet, tenzij de app geïsoleerd is
  es:
    - No recuerda el tamaño ni la posición de la ventana salvo que la app esté aislada
  it:
    - Non ricorda le dimensioni e la posizione della finestra a meno che l'app non sia isolata
  de:
    - Merkt sich Fenstergröße und -position nicht, sofern die App nicht isoliert ist
